<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Working Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f0f0f; color: #e5e5e5; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .code-block { background: #1e1e1e; border-radius: 8px; border: 1px solid #333; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); } 50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); } }
        .ai-thinking { animation: pulse-glow 2s infinite; }
        @keyframes typing { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="glass-panel border-b border-white/10 px-6 py-4 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-purple-500/30" id="botAvatar">AI</div>
            <div>
                <h1 class="font-bold text-lg text-white" id="botName">Your Assistant</h1>
                <div class="flex items-center gap-2 text-xs text-gray-400">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span id="botStatus">Ready</span>
                </div>
            </div>
        </div>
        <button onclick="toggleSettings()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">⚙️</button>
    </header>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="hidden absolute top-16 right-6 w-80 glass-panel rounded-xl border border-white/10 shadow-2xl z-50 p-4">
        <h3 class="font-bold text-white mb-4">Configuration</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Bot Name</label>
                <input type="text" id="configName" value="Your Assistant" class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Select AI Provider</label>
                <select id="configProvider" onchange="toggleProvider()" class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="openrouter">OpenRouter (FREE - Recommended)</option>
                    <option value="gemini">Google Gemini (Free Tier)</option>
                </select>
            </div>
            
            <!-- OpenRouter Settings -->
            <div id="openrouterSettings">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" id="openrouterKey" placeholder="sk-or-v1-..." class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Get free key: openrouter.ai/keys</p>
                </div>
            </div>

            <!-- Gemini Settings -->
            <div id="geminiSettings" class="hidden">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Gemini API Key</label>
                    <input type="password" id="geminiKey" placeholder="AIza..." class="w-full bg-black/50 border border-white/20 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <p class="text-xs text-gray-500 mt-1">Get from: makersuite.google.com/app/apikey</p>
                </div>
            </div>
            
            <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium transition-colors">Save & Connect</button>
            <button onclick="testConnection()" class="w-full bg-green-600/20 hover:bg-green-600/30 text-green-400 border border-green-500/30 py-2 rounded-lg text-sm font-medium transition-colors">Test Connection</button>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth">
        <div class="flex gap-4 items-start">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold shrink-0">AI</div>
            <div class="glass-panel rounded-2xl rounded-tl-sm px-5 py-3 text-gray-200 leading-relaxed max-w-[80%]">
                <p class="mb-2">Namaste! 🙏 I'm your AI assistant.</p>
                <p class="text-sm text-gray-400">I recommend using <strong>OpenRouter</strong> - it's FREE and reliable. Get your API key from openrouter.ai/keys</p>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="glass-panel border-t border-white/10 p-4 shrink-0">
        <div class="max-w-4xl mx-auto">
            <div class="flex gap-2 mb-3 overflow-x-auto pb-2">
                <button onclick="quickAsk('Who is Rahul Gandhi?')" class="whitespace-nowrap px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full text-xs text-gray-300 transition-colors">Who is Rahul Gandhi?</button>
                <button onclick="quickAsk('Explain quantum computing simply')" class="whitespace-nowrap px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full text-xs text-gray-300 transition-colors">Quantum computing</button>
            </div>
            <div class="relative flex items-end gap-2 bg-black/50 border border-white/20 rounded-2xl p-2 focus-within:border-blue-500 transition-colors">
                <textarea id="userInput" rows="1" placeholder="Add API key in Settings first..." class="flex-1 bg-transparent border-none resize-none max-h-32 px-3 py-2 text-white placeholder-gray-500 focus:outline-none text-sm" onkeydown="handleKeyDown(event)" oninput="autoResize(this)" disabled></textarea>
                <button onclick="sendMessage()" id="sendBtn" class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50" disabled>➤</button>
            </div>
        </div>
    </div>

    <script>
        let config = { name: 'Your Assistant', provider: 'openrouter', openrouterKey: '', geminiKey: '' };
        let chatHistory = [];
        let isProcessing = false;

        document.addEventListener('DOMContentLoaded', () => { loadConfig(); });

        function toggleProvider() {
            const provider = document.getElementById('configProvider').value;
            document.getElementById('openrouterSettings').classList.toggle('hidden', provider !== 'openrouter');
            document.getElementById('geminiSettings').classList.toggle('hidden', provider !== 'gemini');
        }

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('hidden'); }

        function saveConfig() {
            config.name = document.getElementById('configName').value || 'Your Assistant';
            config.provider = document.getElementById('configProvider').value;
            config.openrouterKey = document.getElementById('openrouterKey').value.trim();
            config.geminiKey = document.getElementById('geminiKey').value.trim();
            
            const key = config.provider === 'openrouter' ? config.openrouterKey : config.geminiKey;
            if(!key) { showNotification('❌ Please enter an API key!'); return; }
            
            localStorage.setItem('aiBotConfig', JSON.stringify(config));
            document.getElementById('botName').textContent = config.name;
            document.getElementById('botAvatar').textContent = config.name.substring(0, 2).toUpperCase();
            
            const input = document.getElementById('userInput');
            input.disabled = false;
            input.placeholder = `Message ${config.name}...`;
            document.getElementById('sendBtn').disabled = false;
            
            toggleSettings();
            showNotification('✅ API Key saved! Ready to chat.');
        }

        function loadConfig() {
            const saved = localStorage.getItem('aiBotConfig');
            if(saved) {
                config = JSON.parse(saved);
                document.getElementById('configName').value = config.name;
                document.getElementById('configProvider').value = config.provider || 'openrouter';
                document.getElementById('openrouterKey').value = config.openrouterKey || '';
                document.getElementById('geminiKey').value = config.geminiKey || '';
                toggleProvider();
                
                if(config.openrouterKey || config.geminiKey) {
                    const input = document.getElementById('userInput');
                    input.disabled = false;
                    input.placeholder = `Message ${config.name}...`;
                    document.getElementById('sendBtn').disabled = false;
                }
            }
        }

        async function testConnection() {
            const provider = document.getElementById('configProvider').value;
            const key = provider === 'openrouter' ? document.getElementById('openrouterKey').value.trim() : document.getElementById('geminiKey').value.trim();
            
            if(!key) { showNotification('❌ Enter API key first!'); return; }
            showNotification('🔄 Testing connection...');
            
            try {
                let success = false;
                if(provider === 'openrouter') {
                    const res = await fetch('https://openrouter.ai/api/v1/models', { headers: { 'Authorization': `Bearer ${key}` }});
                    success = res.ok;
                } else {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: 'Hi' }] }] })
                    });
                    success = res.ok;
                }
                showNotification(success ? '✅ Connection successful!' : '❌ Invalid API key');
            } catch(e) { showNotification('❌ Network error'); }
        }

        function handleKeyDown(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
        function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px'; }
        
        function quickAsk(text) {
            if((config.provider === 'openrouter' && !config.openrouterKey) || (config.provider === 'gemini' && !config.geminiKey)) {
                showNotification('⚠️ Please add API key in Settings!'); toggleSettings(); return;
            }
            document.getElementById('userInput').value = text; sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if(!message || isProcessing) return;
            
            addMessage(message, 'user');
            input.value = ''; input.style.height = 'auto';
            isProcessing = true; showTyping();
            
            try {
                const response = config.provider === 'openrouter' ? await callOpenRouter(message) : await callGemini(message);
                removeTyping(); addMessage(response, 'assistant');
            } catch(error) { removeTyping(); addMessage(`❌ Error: ${error.message}`, 'assistant'); }
            isProcessing = false;
        }

        // ✅ WORKING OpenRouter API (FREE)
        async function callOpenRouter(message) {
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.openrouterKey}`,
                    'HTTP-Referer': window.location.href,
                    'X-Title': 'AI Assistant Bot'
                },
                body: JSON.stringify({
                    model: 'google/gemini-2.0-flash-exp:free', // FREE model
                    messages: [
                        { role: 'system', content: 'You are a helpful AI assistant. Provide detailed, accurate information.' },
                        ...chatHistory.slice(-4).map(h => ({ role: h.role === 'assistant' ? 'assistant' : 'user', content: h.content })),
                        { role: 'user', content: message }
                    ]
                })
            });
            
            if(!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API request failed');
            }
            const data = await response.json();
            return data.choices[0].message.content;
        }

        // ✅ WORKING Gemini API (v1beta with correct model)
        async function callGemini(message) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: message }] }],
                    generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
                })
            });
            
            if(!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API request failed');
            }
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        function addMessage(content, role) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-4 items-start';
            if(role === 'user') {
                div.innerHTML = `<div class="flex-1 flex justify-end"><div class="bg-blue-600 text-white rounded-2xl rounded-tr-sm px-5 py-3 max-w-[80%]"><p>${escapeHtml(content)}</p></div></div><div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-white text-sm font-bold shrink-0">You</div>`;
            } else {
                div.innerHTML = `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold shrink-0">${config.name.substring(0, 2).toUpperCase()}</div><div class="glass-panel text-gray-200 rounded-2xl rounded-tl-sm px-5 py-3 max-w-[80%]">${formatContent(content)}</div>`;
            }
            container.appendChild(div); scrollToBottom();
            chatHistory.push({role, content, timestamp: new Date()});
        }

        function formatContent(content) {
            content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, '<div class="code-block p-4 my-2 overflow-x-auto"><code class="text-sm font-mono text-green-400">$2</code></div>');
            content = content.replace(/`([^`]+)`/g, '<code class="bg-white/10 px-1.5 py-0.5 rounded text-sm font-mono text-pink-400">$1</code>');
            content = content.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
            content = content.replace(/\n/g, '<br>');
            return content;
        }

        function showTyping() {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.id = 'typingIndicator'; div.className = 'flex gap-4 items-start';
            div.innerHTML = `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold shrink-0 ai-thinking">${config.name.substring(0, 2).toUpperCase()}</div><div class="glass-panel rounded-2xl rounded-tl-sm px-5 py-4 flex items-center gap-1"><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div><div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div></div>`;
            container.appendChild(div); scrollToBottom();
        }

        function removeTyping() { const indicator = document.getElementById('typingIndicator'); if(indicator) indicator.remove(); }
        function scrollToBottom() { const container = document.getElementById('chatContainer'); container.scrollTop = container.scrollHeight; }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        function clearChat() {
            if(confirm('Clear chat?')) {
                document.getElementById('chatContainer').innerHTML = `<div class="flex gap-4 items-start"><div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold shrink-0">${config.name.substring(0, 2).toUpperCase()}</div><div class="glass-panel rounded-2xl rounded-tl-sm px-5 py-3 text-gray-200 leading-relaxed max-w-[80%]"><p class="mb-2">Namaste! 🙏 I'm ${config.name}.</p><p class="text-sm text-gray-400">Ready to help you!</p></div></div>`;
                chatHistory = [];
            }
        }

        function showNotification(message) {
            const existing = document.querySelector('.notification'); if(existing) existing.remove();
            const notif = document.createElement('div');
            notif.className = 'notification fixed top-20 right-6 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-xl border border-white/10 z-50 text-sm';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => { notif.style.opacity = '0'; setTimeout(() => notif.remove(), 300); }, 3000);
        }

        document.addEventListener('click', (e) => {
            const settings = document.getElementById('settingsPanel');
            if(!settings.contains(e.target) && !e.target.closest('button[onclick="toggleSettings()"]') && !settings.classList.contains('hidden')) {
                settings.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
